name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Get version from tag
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) {
            throw "The release tag must point to a commit on master."
          }

          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag must use the format v<major>.<minor>.<patch>."
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore .\AddInManager.sln

      - name: Build
        run: dotnet build .\AddInManager.sln --configuration Release --no-restore --property:Platform=x64

      - name: Build installer
        shell: pwsh
        run: |
          $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $isccPath)) {
            throw "Inno Setup compiler not found: $isccPath"
          }

          & $isccPath "/DMyAppVersion=$env:RELEASE_VERSION" ".\AddinManager.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $installer = Join-Path $env:GITHUB_WORKSPACE "Setup\RevitAddinManager$env:RELEASE_VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer not found: $installer"
          }
          "INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $env:INSTALLER_PATH --clobber
          }
          else {
            gh release create $env:GITHUB_REF_NAME $env:INSTALLER_PATH --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publish failed with exit code $LASTEXITCODE."
          }
